name: test-ui
run-name: Run UI tests with Galata

on:
  workflow_call:
    inputs:
      update-snapshots:
        description: Regenerate Playwright snapshots and upload a patch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-ui:
    continue-on-error: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          cache: true
          activate-environment: default
          environments: "default build"

      - name: Download wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jupytext-test-wheel
          path: dist

      - name: Fix jlpm (use build env's pip-installed version)
        run: |
          mkdir -p ~/.local/bin
          ln -sf "$GITHUB_WORKSPACE/.pixi/envs/build/bin/jlpm" ~/.local/bin/jlpm
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install wheel and UI test dependencies
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip install 'jupytext[test-ui]'

      - name: Uninstall jupyter-fs
        run: |
          # Uninstall jupyter-fs as it overrides the original browser-test.js to
          # check its own functionality (https://github.com/jpmorganchase/jupyter-fs/blob/main/jupyterfs/browser-test.js)
          pip uninstall jupyter-fs -y

      - name: Install galata
        working-directory: jupyterlab/packages/jupyterlab-jupytext-extension/ui-tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: jlpm install

      - name: Install browser
        working-directory: jupyterlab/packages/jupyterlab-jupytext-extension/ui-tests
        run: jlpm playwright install chromium

      - name: Integration tests
        if: ${{ !inputs.update-snapshots }}
        working-directory: jupyterlab/packages/jupyterlab-jupytext-extension/ui-tests
        run: jlpm playwright test

      - name: Regenerate snapshots
        if: inputs.update-snapshots
        working-directory: jupyterlab/packages/jupyterlab-jupytext-extension/ui-tests
        run: jlpm test:update

      - name: Create snapshot patch
        if: inputs.update-snapshots
        run: |
          snapshots=':(glob)jupyterlab/packages/jupyterlab-jupytext-extension/ui-tests/tests/**/*-snapshots/**'
          git add --intent-to-add -- "$snapshots"
          git diff --binary -- "$snapshots" > "$RUNNER_TEMP/playwright-snapshots.patch"

      - name: Upload snapshot patch
        if: inputs.update-snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-snapshots
          path: ${{ runner.temp }}/playwright-snapshots.patch
          if-no-files-found: error

      - name: Upload UI Test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-test-output
          path: |
            jupyterlab/packages/jupyterlab-jupytext-extension/ui-tests/test-results

name: build
run-name: Build package

on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        required: false
        default: false
        description: Upload build artifacts
      ref:
        type: string
        description: Tag to build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.68.0
          cache: true
          activate-environment: default
          environments: "default build"

      - name: Build JupyterLab extension
        run: pixi run -e build build-labextension

      - name: Build package
        run: HATCH_BUILD_HOOKS_ENABLE=true hatch build

      - name: Archive build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist
        if: ${{ inputs.upload }}

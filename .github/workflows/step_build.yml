name: build
run-name: Build package

on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        required: false
        default: false
        description: Upload build artifacts
      ref:
        type: string
        description: Tag to build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.68.0
          cache: true
          activate-environment: default
          environments: "default build"

      - name: Build JupyterLab extension
        run: pixi run -e build build-labextension

      - name: Build package
        run: HATCH_BUILD_HOOKS_ENABLE=true hatch build

      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
        if: ${{ inputs.upload }}

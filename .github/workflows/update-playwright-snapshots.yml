name: Update Playwright Snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    uses: $/.github/workflows/step_zizmor.yml
    with:
      upload-sarif: false

  build:
    needs: [ zizmor ]
    uses: $/.github/workflows/step_build.yml
    with:
      upload-test-wheel: true

  update-snapshots:
    needs: [ build ]
    uses: $/.github/workflows/step_tests-ui.yml
    with:
      update-snapshots: true

name: zizmor
run-name: Run zizmor

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: Upload results to GitHub code scanning
        type: boolean
        default: true
    outputs:
      merge-queue-passed:
        description: Whether CI passed on this push commit in the merge queue
        value: ${{ jobs.zizmor.outputs.merge-queue-passed }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    outputs:
      merge-queue-passed: ${{ steps.merge-queue.outputs.passed }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Upload zizmor results
      if: inputs.upload-sarif
      uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

    # SARIF mode exits successfully even when it reports findings.
    - name: Enforce the zizmor audit
      uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        advanced-security: false
        annotations: true

    - name: Check CI for the merged commit
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: merge-queue
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if run_id="$(timeout --kill-after=2s 10s gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
          -f "head_sha=$GITHUB_SHA" -f event=merge_group -f status=success -F per_page=1 \
          --jq '.workflow_runs[] | select(.event == "merge_group" and .status == "completed" and .conclusion == "success") | .id')" &&
          [[ "$run_id" =~ ^[0-9]+$ ]] &&
          tested_sha="$(timeout --kill-after=2s 10s gh api --paginate --method GET \
          "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" -f filter=latest -F per_page=100 \
          --jq '.jobs[] | select(.name == "Pass" and .status == "completed" and .conclusion == "success") | .head_sha')" &&
          [[ "$tested_sha" == "$GITHUB_SHA" ]]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
          echo "CI Pass succeeded for this commit in merge-queue run $run_id."
        else
          echo "No successful merge-queue run verified. Running full CI."
        fi
